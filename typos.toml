[files]
extend-exclude = [
    # Keep these sorted and unique. They are for fixtures and generated assets only:
    # excluding a source directory would silently switch off the typo check for real code.
    # <block keep-sorted keep-sorted-pattern='^"(?P<value>[^"]+)"' keep-unique line-pattern-forbidden='^"(src|lychee-(bin|lib)/src)'>
    "assets/screencast.svg",
    "fixtures/bench",
    "fixtures/fragments/special-casing.html",
    "fixtures/fragments/special-casing.md",
    "fixtures/text_fragments/index.html",
    # </block>
]

[default.extend-words]
excluder = "excluder"

[default]
extend-ignore-re = [
  # Ignore the line after `// spellchecker:ignore-next-line`:
  "(#|//|///|//!)\\s*spellchecker:ignore-next-line\\n.*",
]
